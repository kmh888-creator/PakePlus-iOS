<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>妈妈，生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a1a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; top: 0; left: 0; z-index: 1; }
  .content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* 开场标题 */
  .title {
    font-size: 2.2em;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4);
    letter-spacing: 4px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 2s ease 0.5s forwards;
    text-align: center;
    line-height: 1.6;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* 照片轮播 */
  .photo-box {
    width: 260px; height: 260px;
    margin-top: 40px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 105, 180, 0.3);
    opacity: 0;
    animation: fadeInUp 2s ease 1.5s forwards;
  }
  .photo-box img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; top: 0; left: 0;
    opacity: 0;
    transition: opacity 1.5s ease, transform 6s ease;
    transform: scale(1);
  }
  .photo-box img.active {
    opacity: 1;
    transform: scale(1.1);
  }

  /* 祝福语 */
  .wish {
    margin-top: 40px;
    font-size: 1.1em;
    color: #fff;
    text-align: center;
    line-height: 2;
    min-height: 80px;
    padding: 0 20px;
    opacity: 0;
    animation: fadeInUp 2s ease 2.5s forwards;
  }
  .wish::after {
    content: "|";
    animation: blink 1s infinite;
    color: #ffd700;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 署名 */
  .signature {
    margin-top: 30px;
    font-size: 0.9em;
    color: #ffd700;
    opacity: 0;
    animation: fadeInUp 2s ease 4s forwards;
  }

  /* 提示 */
  .hint {
    position: fixed;
    bottom: 30px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.8em;
    z-index: 2;
    animation: fadeInUp 2s ease 6s forwards;
    opacity: 0;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="content">
  <div class="title">妈妈<br>生日快乐</div>

  <div class="photo-box" id="photoBox">
    <!-- 把下面的 src 换成你自己的照片文件名 -->
    <img src="photo1.jpg" class="active" alt="照片1">
    <img src="photo2.jpg" alt="照片2">
    <img src="photo3.jpg" alt="照片3">
    <img src="photo4.jpg" alt="照片4">
  </div>

  <div class="wish" id="wish"></div>

  <div class="signature">—— Chihang</div>
</div>

<div class="hint">轻触屏幕，有惊喜 ✨</div>

<script>
/* ========== 1. 照片轮播 ========== */
const photos = document.querySelectorAll('#photoBox img');
let photoIndex = 0;
setInterval(() => {
  photos[photoIndex].classList.remove('active');
  photoIndex = (photoIndex + 1) % photos.length;
  photos[photoIndex].classList.add('active');
}, 3500);

/* ========== 2. 打字机祝福语 ========== */
const wishText = "谢谢你一直以来的爱和付出，愿你永远健康、快乐、被温柔以待。妈妈，我爱你 ❤️";
let wishIndex = 0;
const wishEl = document.getElementById('wish');
function typeWish() {
  if (wishIndex < wishText.length) {
    if (wishText[wishIndex] === '\\n') {
      wishEl.innerHTML += '<br>';
    } else {
      wishEl.innerHTML += wishText[wishIndex];
    }
    wishIndex++;
    setTimeout(typeWish, 100);
  }
}
setTimeout(typeWish, 3000);

/* ========== 3. 烟花/爱心粒子 ========== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function createParticles(x, y) {
  const colors = ['#ffd700', '#ff69b4', '#ff4500', '#00ffff', '#ff1493', '#ffffff'];
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 3 + 2
    });
  }
}

function animate() {
  ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= 0.015;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });

  requestAnimationFrame(animate);
}
animate();

/* 点击/触摸生成烟花 */
document.addEventListener('click', e => createParticles(e.clientX, e.clientY));
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  createParticles(t.clientX, t.clientY);
}, { passive: true });

/* 自动随机放烟花 */
setInterval(() => {
  createParticles(
    Math.random() * canvas.width,
    Math.random() * canvas.height * 0.6
  );
}, 2500);

/* ========== 4. 星空背景 ========== */
const stars = [];
for (let i = 0; i < 100; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5,
    a: Math.random()
  });
}
function drawStars() {
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });
}
setInterval(drawStars, 100);
</script>

</body>
</html>
